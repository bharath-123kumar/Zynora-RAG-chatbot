services:
  # ─────────────────────────────────────────────
  # BACKEND — Zynora RAG API (Node.js / Express)
  # ─────────────────────────────────────────────
  - type: web
    name: zynora-backend
    runtime: node
    rootDir: zynora/backend
    buildCommand: npm install && npm run render:build
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db            # override with your Render env var
      - key: JWT_SECRET
        generateValue: true            # Render auto-generates a secure random value

  # ─────────────────────────────────────────────
  # FRONTEND — Zynora React App (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: zynora-frontend
    runtime: static
    rootDir: zynora/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://zynora-backend.onrender.com/api   # update to your backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
